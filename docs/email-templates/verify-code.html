<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>新视野新闻登录验证码</title>
</head>
<body style="margin:0;padding:0;background-color:#f4f5f7;font-family:'PingFang SC','Microsoft YaHei',Helvetica,Arial,sans-serif;">
  <!-- 邮件客户端兼容性要求:table 布局 + 内联样式,不使用外部资源 -->
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f5f7;">
    <tr>
      <td align="center" style="padding:32px 16px;">
        <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="max-width:600px;width:100%;background-color:#ffffff;border-radius:8px;overflow:hidden;">

          <!-- 品牌头 -->
          <tr>
            <td style="background-color:#0d5cb6;padding:20px 32px;">
              <span style="font-size:20px;font-weight:bold;color:#ffffff;letter-spacing:1px;">新视野新闻</span>
              <span style="font-size:12px;color:#ffffff;opacity:0.8;margin-left:8px;">NEWS</span>
            </td>
          </tr>

          <!-- 正文 -->
          <tr>
            <td style="padding:36px 32px 24px;">
              <p style="margin:0 0 16px;font-size:16px;color:#333333;line-height:1.6;">
                您好:
              </p>
              <p style="margin:0 0 24px;font-size:14px;color:#555555;line-height:1.8;">
                您正在登录<strong style="color:#0d5cb6;">新视野新闻</strong>,本次登录的验证码为:
              </p>

              <!-- 验证码 -->
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
                <tr>
                  <td align="center" style="padding:8px 0 24px;">
                    <div style="display:inline-block;background-color:#f0f6ff;border:1px solid #d6e4f7;border-radius:8px;padding:16px 48px;">
                      <span style="font-size:32px;font-weight:bold;letter-spacing:8px;color:#0d5cb6;font-family:'Courier New',Courier,monospace;">{{code}}</span>
                    </div>
                  </td>
                </tr>
              </table>

              <p style="margin:0 0 12px;font-size:14px;color:#555555;line-height:1.8;">
                验证码 <strong style="color:#d4380d;">5 分钟内</strong>有效,请尽快完成验证。
              </p>
              <p style="margin:0;font-size:13px;color:#999999;line-height:1.8;">
                如非本人操作,请忽略本邮件,您的账号不会受到影响。
              </p>
            </td>
          </tr>

          <!-- 分隔线 -->
          <tr>
            <td style="padding:0 32px;">
              <div style="border-top:1px solid #eeeeee;"></div>
            </td>
          </tr>

          <!-- 页脚 -->
          <tr>
            <td style="padding:20px 32px 28px;">
              <p style="margin:0;font-size:12px;color:#aaaaaa;line-height:1.8;">
                本邮件由系统自动发送,请勿直接回复。<br>
                新视野新闻 · 提供时政、财经、科技、体育、娱乐等全方位新闻资讯
              </p>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
